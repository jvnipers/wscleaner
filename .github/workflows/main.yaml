name: Build

on: push

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: windows-latest
          - os: ubuntu-latest
            container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone AMBuild
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/ambuild
          path: ./ambuild

      - name: Install AMBuild
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            pip install setuptools
          fi
          cd ambuild && python setup.py install && cd ..

      - name: Build
        shell: bash
        run: |
          mkdir build && cd build
          git config --global --add safe.directory ..
          python ../configure.py
          ambuild

      - name: Archive build
        uses: actions/upload-artifact@v4
        with:
          name: wscleaner-${{ runner.os }}
          path: ./build/package

  release:
    if: github.ref == 'refs/heads/main' 
    name: Release
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: /home/runner/artifacts

      - name: Create folders
        run: |
          mkdir /home/runner/releases

      - name: Archive builds
        run: |
          # Every plugin has its own folder in the package, and each one is released on its own.
          for plugin in wscleaner wshostmap; do
            (cd /home/runner/artifacts/wscleaner-Linux/$plugin && tar -czvf /home/runner/releases/$plugin-linux.tar.gz *)
            (cd /home/runner/artifacts/wscleaner-Windows/$plugin && zip -r /home/runner/releases/$plugin-windows.zip *)
          done

      - name: Create Tag
        id: create_tag
        run: |
          TAG_NAME="latest"
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          git tag -f $TAG_NAME
          git push -f origin $TAG_NAME

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: |
            /home/runner/releases/wscleaner-linux.tar.gz
            /home/runner/releases/wscleaner-windows.zip
            /home/runner/releases/wshostmap-linux.tar.gz
            /home/runner/releases/wshostmap-windows.zip
          generate_release_notes: false
          prerelease: false
